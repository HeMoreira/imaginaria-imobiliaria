{% extends 'base.html' %}

{% block title %}Admin - Portal Negócios {% endblock %}

{% block main %}
<main>
    <section class="hero">
        <div class="hero__bg">
        <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1800&q=80" alt="Imóvel de luxo" class="hero__img" />
        <div class="hero__overlay"></div>
        </div>
        <div class="hero__content">
            <h1 class="hero__title">Painel de<br/><em>Administração</em></h1>
            <div class="hero__actions">
                <a href="#imoveis" class="btn btn--primary">Ver Imóveis</a>
                <a href="#formulario" class="btn btn--ghost">Novo Imóvel</a>
            </div>
        </div>
    </section>
    <section class="form">
        <div class="listings__header">
            <span class="section-label">Formulário</span>
            <h2 class="section-title">Adicionar Imóvel</h2>
        </div>
        <form action="/admin" method="POST" enctype="multipart/form-data">
            <input type="text" name="nome" id="nome" placeholder="Nome do imóvel" required>
            <input type="text" name="descricao" id="descricao" placeholder="Descrição do imóvel" required>
            <select name="tipo_de_produto" id="tipo_de_produto" required>
                <option value="">Selecione o tipo do imóvel</option>
                <option value="APARTAMENTO">Apartamento</option>
                <option value="CASA">Casa</option>
                <option value="TERRENO">Terreno</option>
            </select>
            <select name="status" id="status" required>
                <option value="">Selecione o status</option>
                <option value="ENTREGUE">Entregue</option>
                <option value="DISPONIVEL">Disponível</option>
                <option value="LANCAMENTO">Lançamento</option>
                <option value="EM_CONSTRUCAO">Em Construção</option>
                <option value="FUTURO_LANCAMENTO">Futuro Lançamento</option>
            </select>
            <label for="esta_visivel">Clientes podem ver esse produto?</label>
            <input type="checkbox" name="esta_visivel" id="esta_visivel" value="true">
            
            <input type="number" step="0.01" name="preco_compra" id="preco_compra" placeholder="Preço de Compra (opcional)" min="0">
            <input type="number" step="0.01" name="preco_aluguel" id="preco_aluguel" placeholder="Preço de Aluguel (opcional)" min="0">
            <input type="number" step="0.01" name="condominio" id="condominio" placeholder="Preço do Condomínio (opcional)" min="0">
            <input type="number" step="0.01" name="iptu" id="iptu" placeholder="Preço do IPTU (opcional)" min="0">

            <input type="number" name="menor_area_em_metros_quadrados" id="menor_area_em_metros_quadrados" placeholder="Menor Área em Metros Quadrados (area do menor apartamento)" min="0" required>
            <input type="number" name="maior_area_em_metros_quadrados" id="maior_area_em_metros_quadrados" placeholder="Maior Área em Metros Quadrados (area do maior apartamento)" min="0" required>
            <input type="number" name="menor_quantidade_de_quartos" id="menor_quantidade_de_quartos" placeholder="Menor Quantidade de Quartos (quantidade de quartos do menor apartamento)" min="0" default="0" required>
            <input type="number" name="maior_quantidade_de_quartos" id="maior_quantidade_de_quartos" placeholder="Maior Quantidade de Quartos (quantidade de quartos do maior apartamento)" min="0" default="0" required>

            <input type="text" name="cidade" id="cidade" placeholder="Cidade do imóvel" required>
            <input type="text" name="bairro" id="bairro" placeholder="Bairro do imóvel" required>
            <input type="text" name="endereco" id="endereco" placeholder="Endereço do imóvel" required>
            <input type="text" name="cep" id="cep" placeholder="CEP do imóvel" required>

            <br>
            <input type="file" accept="image/*" name="caminho_da_imagem_principal" id="caminho_da_imagem_principal" placeholder="Caminho da imagem principal do imóvel" required><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_fachada1" id="caminho_da_imagem_de_fachada1" placeholder="Caminho da imagem de fachada 1 do imóvel" required><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_fachada2" id="caminho_da_imagem_de_fachada2" placeholder="Caminho da imagem de fachada 2 do imóvel" required><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum1" id="caminho_da_imagem_de_area_comum1" placeholder="Caminho da imagem de área comum 1 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum1" id="descrição_da_imagem_de_area_comum1" placeholder="Descrição da imagem de área comum 1 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum2" id="caminho_da_imagem_de_area_comum2" placeholder="Caminho da imagem de área comum 2 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum2" id="descrição_da_imagem_de_area_comum2" placeholder="Descrição da imagem de área comum 2 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum3" id="caminho_da_imagem_de_area_comum3" placeholder="Caminho da imagem de área comum 3 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum3" id="descrição_da_imagem_de_area_comum3" placeholder="Descrição da imagem de área comum 3 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum4" id="caminho_da_imagem_de_area_comum4" placeholder="Caminho da imagem de área comum 4 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum4" id="descrição_da_imagem_de_area_comum4" placeholder="Descrição da imagem de área comum 4 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum5" id="caminho_da_imagem_de_area_comum5" placeholder="Caminho da imagem de área comum 5 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum5" id="descrição_da_imagem_de_area_comum5" placeholder="Descrição da imagem de área comum 5 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum6" id="caminho_da_imagem_de_area_comum6" placeholder="Caminho da imagem de área comum 6 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum6" id="descrição_da_imagem_de_area_comum6" placeholder="Descrição da imagem de área comum 6 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum7" id="caminho_da_imagem_de_area_comum7" placeholder="Caminho da imagem de área comum 7 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum7" id="descrição_da_imagem_de_area_comum7" placeholder="Descrição da imagem de área comum 7 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum8" id="caminho_da_imagem_de_area_comum8" placeholder="Caminho da imagem de área comum 8 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum8" id="descrição_da_imagem_de_area_comum8" placeholder="Descrição da imagem de área comum 8 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum9" id="caminho_da_imagem_de_area_comum9" placeholder="Caminho da imagem de área comum 9 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum9" id="descrição_da_imagem_de_area_comum9" placeholder="Descrição da imagem de área comum 9 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_imagem_de_area_comum10" id="caminho_da_imagem_de_area_comum10" placeholder="Caminho da imagem de área comum 10 do imóvel">
            <input type="text" name="descrição_da_imagem_de_area_comum10" id="descrição_da_imagem_de_area_comum10" placeholder="Descrição da imagem de área comum 10 do imóvel"><br>

            <input type="file" accept="image/*" name="caminho_da_planta_baixa1" id="caminho_da_planta_baixa1" placeholder="Caminho da planta baixa 1 do imóvel">
            <input type="text" name="descrição_da_planta_baixa1" id="descrição_da_planta_baixa1" placeholder="Descrição da planta baixa 1 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa2" id="caminho_da_planta_baixa2" placeholder="Caminho da planta baixa 2 do imóvel">
            <input type="text" name="descrição_da_planta_baixa2" id="descrição_da_planta_baixa2" placeholder="Descrição da planta baixa 2 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa3" id="caminho_da_planta_baixa3" placeholder="Caminho da planta baixa 3 do imóvel">
            <input type="text" name="descrição_da_planta_baixa3" id="descrição_da_planta_baixa3" placeholder="Descrição da planta baixa 3 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa4" id="caminho_da_planta_baixa4" placeholder="Caminho da planta baixa 4 do imóvel">
            <input type="text" name="descrição_da_planta_baixa4" id="descrição_da_planta_baixa4" placeholder="Descrição da planta baixa 4 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa5" id="caminho_da_planta_baixa5" placeholder="Caminho da planta baixa 5 do imóvel">
            <input type="text" name="descrição_da_planta_baixa5" id="descrição_da_planta_baixa5" placeholder="Descrição da planta baixa 5 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa6" id="caminho_da_planta_baixa6" placeholder="Caminho da planta baixa 6 do imóvel">
            <input type="text"  name="descrição_da_planta_baixa6" id="descrição_da_planta_baixa6" placeholder="Descrição da planta baixa 6 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa7" id="caminho_da_planta_baixa7" placeholder="Caminho da planta baixa 7 do imóvel">
            <input type="text" name="descrição_da_planta_baixa7" id="descrição_da_planta_baixa7" placeholder="Descrição da planta baixa 7 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa8" id="caminho_da_planta_baixa8" placeholder="Caminho da planta baixa 8 do imóvel">
            <input type="text" name="descrição_da_planta_baixa8" id="descrição_da_planta_baixa8" placeholder="Descrição da planta baixa 8 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa9" id="caminho_da_planta_baixa9" placeholder="Caminho da planta baixa 9 do imóvel">
            <input type="text" name="descrição_da_planta_baixa9" id="descrição_da_planta_baixa9" placeholder="Descrição da planta baixa 9 do imóvel"><br>
            <input type="file" accept="image/*" name="caminho_da_planta_baixa10" id="caminho_da_planta_baixa10" placeholder="Caminho da planta baixa 10 do imóvel">
            <input type="text" name="descrição_da_planta_baixa10" id="descrição_da_planta_baixa10" placeholder="Descrição da planta baixa 10 do imóvel"><br>

            <button type="submit">Adicionar Imóvel</button>
        </form>
        {% include 'partials/_listagem_imoveis.html' %}
    </section>
</main>
{% endblock %}
