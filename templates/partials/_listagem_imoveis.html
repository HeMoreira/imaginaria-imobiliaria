<section id="imoveis" class="general-section-padding general-section-background">
    <div class="general-content">
        <span class="section-label">Portfólio</span>
        <h2 class="section-title">Imóveis disponíveis</h2>
        <div class="filter-buttons-container">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="apartamento">Apartamentos</button>
            <button class="filter-btn" data-filter="casa">Casas</button>
            <button class="filter-btn" data-filter="cobertura">Coberturas</button>
        </div>
    </div>
    <div class="general-content">
        <div class="carousel-track" id="carouselTrack">
            {% for imovel in imoveis %}
            <div class="card">
                <div class="card-bg">
                {% for imagem in imovel.imagens_do_produto %}
                <img class="card-img" src="{{ imagem.caminho_da_imagem_principal }}" alt="Fachada de {{ imovel.nome }}" loading="lazy" />
                {% endfor %}
                </div>
                <span class="card-type" data-category="{{ imovel.tipo_de_produto.value }}">{{ imovel.tipo_de_produto.value }}</span>
                <div class="card-body">
                    <h3 class="card-name">{{ imovel.nome }}</h3>
                    <p class="card-location">{{ imovel.bairro }}</p>
                    <div class="card-footer">
                        <a class="card-info-redirect" href="">Ver Imóvel</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="carousel-nav">
            <div class="carousel-dots" id="carouselDots"></div>
            <button class="carousel-nav__btn" id="btnPrev" aria-label="Anterior">&#8592;</button>
            <button class="carousel-nav__btn" id="btnNext" aria-label="Próximo">&#8594;</button>
        </div>
    </div>
</section>
<script>
  const track  = document.getElementById('carouselTrack');
  const dotsEl = document.getElementById('carouselDots');
  const cards  = Array.from(track.querySelectorAll('.prop-card'));
 
  cards.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'carousel-dots__dot' + (i === 0 ? ' active' : '');
    d.addEventListener('click', () => scrollToCard(i));
    dotsEl.appendChild(d);
  });
 
  function updateDots() {
    const gap = parseFloat(getComputedStyle(track).gap) || 24;
    const idx = Math.round(track.scrollLeft / (cards[0].offsetWidth + gap));
    dotsEl.querySelectorAll('.carousel-dots__dot').forEach((d, i) =>
      d.classList.toggle('active', i === idx));
  }
 
  function scrollToCard(i) {
    const gap = parseFloat(getComputedStyle(track).gap) || 24;
    track.scrollTo({ left: i * (cards[0].offsetWidth + gap), behavior: 'smooth' });
  }
 
  function step(dir) {
    const gap = parseFloat(getComputedStyle(track).gap) || 24;
    const cur = Math.round(track.scrollLeft / (cards[0].offsetWidth + gap));
    scrollToCard(Math.max(0, Math.min(cards.length - 1, cur + dir)));
  }
 
  document.getElementById('btnPrev').addEventListener('click', () => step(-1));
  document.getElementById('btnNext').addEventListener('click', () => step(1));
  track.addEventListener('scroll', updateDots, { passive: true });
 
  /* drag to scroll (desktop) */
  let isDown = false, startX, scrollLeft;
 
  track.addEventListener('mousedown', e => {
    isDown = true;
    track.style.cursor = 'grabbing';
    startX = e.pageX - track.offsetLeft;
    scrollLeft = track.scrollLeft;
  });
  track.addEventListener('mouseleave', () => { isDown = false; track.style.cursor = 'grab'; });
  track.addEventListener('mouseup',    () => { isDown = false; track.style.cursor = 'grab'; });
  track.addEventListener('mousemove',  e => {
    if (!isDown) return;
    e.preventDefault();
    track.scrollLeft = scrollLeft - (e.pageX - track.offsetLeft - startX) * 1.4;
  });
</script>
