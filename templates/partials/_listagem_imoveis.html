<section id="imoveis" class="general-section-padding general-section-background">
    <div class="general-content">
        <span class="section-label">Portfólio</span>
        <h2 class="section-title">Imóveis disponíveis</h2>
        <div class="filter-buttons-container">
            <button class="filter-btn active" data-filter="ALL">Todos</button>
            <button class="filter-btn" data-filter="APARTAMENTO">Apartamentos</button>
            <button class="filter-btn" data-filter="CASA">Casas</button>
            <button class="filter-btn" data-filter="TERRENO">Terrenos</button>
        </div>
    </div>
    <div class="carousel">
        <div class="carousel-slides">
            {% for imovel in imoveis %}
            <div class="card">
                <div class="card-bg">
                {% for imagem in imovel.imagens_do_produto %}
                <img class="card-img" src="{{ imagem.caminho_da_imagem_principal }}" alt="Fachada de {{ imovel.nome }}" loading="lazy" />
                {% endfor %}
                </div>
                <span class="card-type" data-category="{{ imovel.tipo_de_produto.value }}">{{ imovel.tipo_de_produto.value }}</span>
                <div class="card-body">
                    <h3 class="card-name">{{ imovel.nome }}</h3>
                    <p class="card-location">{{ imovel.bairro }}</p>
                    <div class="card-footer">
                        <a class="card-info-redirect" href="">Ver Imóvel</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <button class="carousel-btn--left">&#8592;</button>
        <button class="carousel-btn--right">&#8594;</button>
    </div>
</section>
<script>
    const filtro_listagem = "{{ filtro_listagem }}";
</script>
<script src="static/js/listings.js"></script>
