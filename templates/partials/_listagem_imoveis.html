<section id="imoveis" class="listings">
    <div class="listings__header">
        <span class="section-label">Portfólio</span>
        <h2 class="section-title">Imóveis disponíveis</h2>
        <div class="listings__filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="apartamento">Apartamentos</button>
            <button class="filter-btn" data-filter="casa">Casas</button>
            <button class="filter-btn" data-filter="cobertura">Coberturas</button>
        </div>
    </div>
    <div class="listings__grid" id="listingsGrid">
        {% for imovel in imoveis %}
        <div class="prop-card" data-category="{{ imovel.category }}">
            <div class="prop-card__thumb">
                {% for imagem in imovel.imagens_do_produto %}
                <img src="{{ imagem.caminho_da_imagem_principal }}" alt="Fachada de {{ imovel.nome }}" loading="lazy" />
                {% endfor %}
                <span class="prop-card__badge">{{ imovel.tipo_de_produto.value }}</span>
                <span class="prop-card__status {{ statusClass }}">{{ imovel.status.value }}</span>
            </div>
            <div class="prop-card__body">
                <h3 class="prop-card__name">{{ imovel.nome }}</h3>
                <p class="prop-card__location">{{ imovel.bairro }}</p>
                <div class="prop-card__footer">
                <span class="prop-card__cta">
                    Ver imóvel
                </span>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
